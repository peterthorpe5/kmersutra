name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Static checks
        run: python -m ruff check kmersutra tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  coverage-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,all]"
      - name: Coverage
        run: python -m coverage run -m unittest discover -s tests && python -m coverage report
      - name: Build
        run: python -m build
      - name: Check wheel contents
        run: python scripts/check_wheel_contents.py --dist-dir dist
