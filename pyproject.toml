[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kmersutra"
version = "0.51.1"
description = "Outgroup-aware k-mer framework for clade and species-resolved metagenomic detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Peter Thorpe"},
]
keywords = [
    "bioinformatics",
    "k-mers",
    "metagenomics",
    "pathogen-detection",
    "taxonomy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["pandas", "openpyxl"]

[project.urls]
Homepage = "https://github.com/peterthorpe5/kmersutra"
Repository = "https://github.com/peterthorpe5/kmersutra"
Issues = "https://github.com/peterthorpe5/kmersutra/issues"

[project.scripts]
kmersutra-build-panel = "kmersutra.cli.build_clade_kmer_panel:main"
kmersutra-screen = "kmersutra.cli.screen_reads_for_clade_kmers:main"
kmersutra-download-ncbi = "kmersutra.cli.download_ncbi_taxon_genomes:main"
kmersutra-download-genomes = "kmersutra.cli.download_genomes_for_kmersutra:main"
kmersutra-extract-features = "kmersutra.cli.extract_ml_features:main"
kmersutra-train-classifier = "kmersutra.cli.train_classifier:main"
kmersutra-predict = "kmersutra.cli.predict_classifier:main"
kmersutra-build-call-training = "kmersutra.cli.build_call_training_table:main"
kmersutra-train-call-calibrator = "kmersutra.cli.train_call_calibrator:main"
kmersutra-summarise-run = "kmersutra.cli.summarise_spikein_run:main"
kmersutra-summarise-lca = "kmersutra.cli.summarise_lca:main"
kmersutra-summarise-comparable-benchmark = "kmersutra.cli.summarise_comparable_benchmark:main"
kmersutra-threshold-sweep = "kmersutra.cli.threshold_sweep:main"
kmersutra-benchmark-postprocess = "kmersutra.cli.benchmark_postprocess:main"
kmersutra-summarise-spikeins = "kmersutra.cli.summarise_kmersutra_spikeins:main"
kmersutra-download-taxonomy = "kmersutra.cli.download_taxonomy:main"
kmersutra-merge-panels = "kmersutra.cli.merge_panels:main"
kmersutra-merge-modules = "kmersutra.cli.merge_modules:main"
kmersutra-validate-panel = "kmersutra.cli.validate_panel:main"
kmersutra-validate-call-calibrator = "kmersutra.cli.validate_call_calibrator:main"
kmersutra-label-zymo-calls = "kmersutra.cli.label_zymo_calls:main"
kmersutra-evaluate-call-predictions = "kmersutra.cli.evaluate_call_predictions:main"
kmersutra-label-mock-calls = "kmersutra.cli.label_mock_community_calls:main"
kmersutra-audit-reference-panel = "kmersutra.cli.audit_reference_panel:main"
kmersutra-subset-reads = "kmersutra.cli.subset_reads:main"
kmersutra-run-benchmark = "kmersutra.cli.run_benchmark:main"
kmersutra-summarise-mock-benchmark = "kmersutra.cli.summarise_mock_benchmark:main"
kmersutra-package-inventory = "kmersutra.package_inventory:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage[toml]>=7.6",
    "matplotlib",
    "ruff>=0.12",
]
reporting = ["matplotlib", "openpyxl"]
interactive = ["plotly"]
stats = ["scipy"]
ml = ["scikit-learn", "joblib"]
parquet = ["pyarrow"]
ncbi = ["requests", "biopython"]
docs = ["Sphinx>=7.4,<10", "sphinx-rtd-theme>=3.0,<4"]
all = ["matplotlib", "openpyxl", "plotly", "scipy", "pyarrow", "requests", "biopython", "scikit-learn", "joblib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kmersutra", "kmersutra.*"]
exclude = ["tests*", "kmersutra_ai_validation*"]

[tool.coverage.run]
branch = true
source = ["kmersutra"]
omit = [
    "kmersutra/cli/*",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# Version 0.51.1 reaches 80% whole-package branch coverage. Keep CI at that
# ratcheted floor while new work advances towards the 90% target.
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
